<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
	<title>Capy Racing</title>
	<style>
		* { box-sizing: border-box; }
		body {
			margin: 0;
			overflow: hidden;
			background: #0f1512;
			color: #fff;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
		}
		canvas { display: block; touch-action: none; }
		#editor-link, #fullscreen-btn {
			position: absolute;
			bottom: 12px;
			color: #fff;
			font: 14px sans-serif;
			text-decoration: none;
			background: rgba(0, 0, 0, 0.5);
			padding: 8px 14px;
			border-radius: 6px;
			z-index: 10;
			border: none;
			cursor: pointer;
		}
		#editor-link { right: 16px; }
		#fullscreen-btn { left: 16px; }
		#editor-link:hover, #fullscreen-btn:hover { background: rgba(0, 0, 0, 0.7); }
		body.menu-open #editor-link,
		body.menu-open #fullscreen-btn { display: none; }
		#main-menu {
			position: fixed;
			inset: 0;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 24px;
			background:
				linear-gradient(rgba(15, 21, 18, 0.3), rgba(15, 21, 18, 0.82)),
				radial-gradient(circle at 50% 28%, rgba(255, 215, 116, 0.22), transparent 36%),
				#0f1512;
			z-index: 40;
		}
		#main-menu[hidden] { display: none; }
		.menu-panel {
			width: min(380px, 100%);
			display: grid;
			gap: 14px;
			text-align: center;
		}
		.menu-title {
			margin: 0 0 10px;
			font-size: clamp(38px, 9vw, 68px);
			font-weight: 850;
			line-height: 0.92;
			letter-spacing: 0;
			text-transform: uppercase;
		}
		.menu-actions {
			display: grid;
			gap: 10px;
		}
		.menu-btn {
			width: 100%;
			border: 1px solid rgba(255, 255, 255, 0.16);
			border-radius: 8px;
			padding: 14px 18px;
			background: rgba(255, 255, 255, 0.12);
			color: #fff;
			font-size: 17px;
			font-weight: 800;
			text-decoration: none;
			cursor: pointer;
			box-shadow: 0 14px 34px rgba(0, 0, 0, 0.28);
		}
		.menu-btn:hover,
		.menu-btn:focus-visible {
			background: rgba(255, 255, 255, 0.2);
			outline: none;
		}
		.menu-btn.primary {
			background: #ffd05a;
			border-color: #ffd05a;
			color: #17130a;
		}
		.menu-btn.primary:hover,
		.menu-btn.primary:focus-visible { background: #ffe08d; }
		@media (pointer: coarse) {
			#editor-link { bottom: auto; top: 12px; right: 12px; }
			#fullscreen-btn { display: none; }
		}
	</style>
	<script type="importmap">
	{
		"imports": {
			"three": "https://cdn.jsdelivr.net/npm/three@0.183.2/build/three.module.js",
			"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.2/examples/jsm/",
			"crashcat": "https://esm.sh/crashcat@0.0.2"
		}
	}
	</script>
</head>
<body class="menu-open">
	<div id="main-menu">
		<div class="menu-panel">
			<h1 class="menu-title">Capy Racing</h1>
			<div class="menu-actions">
				<button id="play-btn" class="menu-btn primary">Play</button>
				<a id="menu-editor-link" class="menu-btn" href="editor.html">Level Editor</a>
			</div>
		</div>
	</div>

	<a id="editor-link" href="editor.html">Create your own track</a>
	<button id="fullscreen-btn">Fullscreen</button>

	<script type="module">
		const params = new URLSearchParams( location.search );
		const map = params.get( 'map' );
		const autoPlay = params.get( 'play' ) === '1';
		const editorLink = document.getElementById( 'editor-link' );
		const menuEditorLink = document.getElementById( 'menu-editor-link' );
		const mainMenu = document.getElementById( 'main-menu' );
		const playBtn = document.getElementById( 'play-btn' );
		let gameStarted = false;

		if ( map ) {
			const editUrl = 'editor.html?map=' + encodeURIComponent( map );
			editorLink.href = editUrl;
			editorLink.textContent = 'Edit this track';
			menuEditorLink.href = editUrl;
		}

		async function startGame() {
			if ( gameStarted ) return;
			gameStarted = true;
			playBtn.disabled = true;
			playBtn.textContent = 'Loading...';
			document.body.classList.remove( 'menu-open' );
			mainMenu.hidden = true;
			const game = await import( './js/main.js' );
			await game.init();
		}

		playBtn.addEventListener( 'click', startGame );

		if ( autoPlay ) startGame();

		const fsBtn = document.getElementById( 'fullscreen-btn' );
		fsBtn.addEventListener( 'click', () => {
			if ( ! document.fullscreenElement ) {
				document.documentElement.requestFullscreen();
			} else {
				document.exitFullscreen();
			}
		} );
		document.addEventListener( 'fullscreenchange', () => {
			fsBtn.textContent = document.fullscreenElement ? 'Exit Fullscreen' : 'Fullscreen';
		} );
	</script>
</body>
</html>
